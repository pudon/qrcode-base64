name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署串行执行，不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite 8 要求 Node ^20.19.0 || >=22.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/vue3-demo/package-lock.json

      # demo 的 vite.config.js 用 alias 直接指向 dist/qrcode-base64.esm.mjs，
      # 所以必须先构建主包，否则 demo 构建时解析不到这个模块
      - name: Build library
        run: |
          npm ci
          npm run build

      - name: Build demo
        working-directory: demo/vue3-demo
        run: |
          npm ci
          npm run build

      # enablement: 仓库未启用 Pages 时自动开启，省去手动到 Settings → Pages 选 source
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/vue3-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
